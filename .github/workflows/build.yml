name: Build Echo debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:   # lets you press "Run workflow" by hand

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Save the APK so you can download it
        uses: actions/upload-artifact@v4
        with:
          name: Echo-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Check the APK has no INTERNET permission
        run: |
          AAPT2=$(ls $ANDROID_HOME/build-tools/*/aapt2 | sort -V | tail -1)
          "$AAPT2" dump permissions app/build/outputs/apk/debug/app-debug.apk | tee perms.txt
          if grep -q "android.permission.INTERNET" perms.txt; then
            echo "ERROR: INTERNET permission found"; exit 1
          fi
          echo "OK: no INTERNET permission"
